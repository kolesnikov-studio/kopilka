name: Release

# Сборка артефактов релиза на тег v* (ARCHITECTURE.md §7):
# Android universal APK, Windows NSIS + portable zip, Linux AppImage,
# черновой GitHub Release с заметками из release-notes.md (русский текст,
# D-53). Публикация — руками после проверки черновика.
#
# Сами сборочные джобы живут в переиспользуемом build-artifacts.yml
# (D-108): тот же код собирает те же артефакты в штатном CI на push main —
# пре-релизная проверка до постановки тега. Здесь — вызов на теге
# и черновик Release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Build artifacts
    uses: ./.github/workflows/build-artifacts.yml
    with:
      # Тег (v0.6.0) — имена артефактов как в релизе:
      # Kopilka-setup-v0.6.0.exe, Kopilka-portable-v0.6.0.zip,
      # Kopilka-0.6.0-x86_64.AppImage.
      artifact_label: ${{ github.ref_name }}

  draft-release:
    name: Draft GitHub Release
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f release-notes.md || { echo "::error::Нет release-notes.md — заметки релиза обновляет исполнитель в задаче подготовки (D-53)"; exit 1; }
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Kopilka $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/*
